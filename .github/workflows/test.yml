name: Automation suites
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  javascript:
    name: JavaScript ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: playwright-javascript/package-lock.json
      - run: npm --prefix playwright-javascript ci
      - run: npm --prefix playwright-javascript run lint
      - run: npm --prefix playwright-javascript run format:check
      - run: npm --prefix playwright-javascript run lint:workspace
      - run: npm --prefix playwright-javascript run format:workspace:check
      - name: Install browser only for web
        if: matrix.suite == 'web'
        working-directory: playwright-javascript
        run: npx playwright install --with-deps chromium
      - run: node scripts/run.mjs js-${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: javascript-${{ matrix.suite }}-reports
          path: |
            playwright-javascript/reports/
            playwright-javascript/artifacts/
          if-no-files-found: warn
  java:
    name: ${{ matrix.framework }} ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: playwright-java
            suite: api
            target: pw-api
          - framework: playwright-java
            suite: web
            target: pw-web
          - framework: restassured-java
            suite: api
            target: ra-api
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and check formatting
        working-directory: ${{ matrix.framework }}
        run: ./mvnw -B -ntp install -DskipTests spotless:check
      - name: Install browser only for web
        if: matrix.suite == 'web'
        working-directory: playwright-java
        run: ./mvnw -B -ntp -pl web-tests org.codehaus.mojo:exec-maven-plugin:3.6.4:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test '-Dexec.args=install --with-deps chromium'
      - run: node scripts/run.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.framework }}-${{ matrix.suite }}-reports
          path: |
            ${{ matrix.framework }}/**/target/surefire-reports/
            ${{ matrix.framework }}/**/target/allure-results/
            ${{ matrix.framework }}/**/target/artifacts/
            ${{ matrix.framework }}/**/target/reports/
          if-no-files-found: warn
